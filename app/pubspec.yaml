name: hajiz
description: "سيزر: حجز مواعيد الصالونات في البصرة."
publish_to: 'none'
version: 0.5.0+5

environment:
  sdk: ^3.13.4

dependencies:
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  # أيقونات أنواع الخدمات مرسومة بصيغة متجهة
  flutter_svg: ^2.2.1
  geolocator: ^14.0.3
  http: ^1.6.0
  image_picker: ^1.2.3
  intl: ^0.20.3
  latlong2: ^0.10.1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  # خرائط متجهة من خدمة الخرائط المفتوحة (النسخة التي يوصي بها مطوروها للإنتاج مع هذه النسخة من مكتبة الخرائط)
  vector_map_tiles: 9.0.0-beta.13

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  # ملف ترجمة مستقل: كل النصوص في lib/l10n/app_ar.arb
  generate: true
  assets:
    - assets/service_icons/
  fonts:
    # خط عربي هندسي قريب من خط التصميم الأصلي، ويغطي الحروف الكردية والفارسية (ڕ ڵ ۆ ێ ە گ چ پ ژ)
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-400.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-500.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-600.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-700.ttf
          weight: 700

name: app

on:
  push:
    paths: ['app/**', '.github/workflows/app.yml']
  pull_request:
    paths: ['app/**', '.github/workflows/app.yml']
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # أخطاء الاختبارات تظهر كملاحظات على التشغيل نفسه (السجل الكامل لا يُقرأ من خارج الموقع)
      - run: flutter test --reporter expanded --file-reporter json:test-results.json
      - if: failure()
        run: |
          python3 - <<'PY'
          import json
          names, errors = {}, []
          for line in open('test-results.json', encoding='utf-8'):
              try:
                  e = json.loads(line)
              except ValueError:
                  continue
              if e.get('type') == 'testStart':
                  names[e['test']['id']] = e['test']['name']
              elif e.get('type') == 'error':
                  errors.append((names.get(e['testID'], '?'), e.get('error', ''), e.get('stackTrace', '')))
          for name, error, stack in errors[:8]:
              text = (error + '\n' + '\n'.join(stack.splitlines()[:12]))[:3000]
              text = text.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              print(f'::error title={name[:120]}::{text}')
          PY
      # نسخة تجريبية للتثبيت المباشر على هاتف أندرويد (موقّعة بمفتاح التطوير)
      # رقم البناء يظهر في حسابي، ويزيد مع كل بناء فيُثبَّت فوق النسخة السابقة
      - run: flutter build apk --release --build-number=${{ github.run_number }} --dart-define=BUILD_NUMBER=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: hajiz-android-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

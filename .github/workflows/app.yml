name: app

on:
  push:
    paths: ['app/**', '.github/workflows/app.yml']
  pull_request:
    paths: ['app/**', '.github/workflows/app.yml']
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: |
          if flutter pub get > pubget.txt 2>&1; then cat pubget.txt; exit 0; fi
          cat pubget.txt
          tail -25 pubget.txt | while IFS= read -r line; do [ -n "$line" ] && echo "::error::$line"; done
          exit 1
      # ملاحظات المحلل تظهر على التشغيل نفسه (السجل الكامل لا يُقرأ من خارج الموقع)
      - run: |
          if flutter analyze > analyze.txt 2>&1; then exit 0; fi
          cat analyze.txt
          grep -E '(error|warning|info) •' analyze.txt | head -20 | while IFS= read -r line; do echo "::error::$line"; done
          exit 1
      # أخطاء الاختبارات تظهر كملاحظات على التشغيل نفسه (السجل الكامل لا يُقرأ من خارج الموقع)
      - run: flutter test --reporter expanded --file-reporter json:test-results.json
      - if: failure()
        run: |
          python3 - <<'PY'
          import json
          names, errors, prints = {}, [], {}
          for line in open('test-results.json', encoding='utf-8'):
              try:
                  e = json.loads(line)
              except ValueError:
                  continue
              if e.get('type') == 'testStart':
                  names[e['test']['id']] = e['test']['name']
              elif e.get('type') == 'print':
                  prints.setdefault(e['testID'], []).append(e.get('message', ''))
              elif e.get('type') == 'error':
                  # فلاتر يطبع الاستثناء الحقيقي قبل رسالة الفشل
                  printed = '\n'.join(prints.get(e['testID'], []))
                  errors.append((names.get(e['testID'], '?'), printed + '\n' + e.get('error', ''), e.get('stackTrace', '')))
          n = 0
          for name, error, stack in errors:
              title = name.replace(',', ' ').replace(':', ' ')[:80]
              text = error + '\n' + '\n'.join(stack.splitlines()[:10])
              # الملاحظة الواحدة قصيرة، فيُقسم النص الطويل على عدة ملاحظات
              for i in range(0, min(len(text), 7000), 800):
                  chunk = text[i:i + 800].replace('%', '%25').replace('\r', '').replace('\n', '%0A').replace('::', ': :')
                  n += 1
                  if n <= 9:
                      print(f'::error title={title} {i // 800 + 1}::{chunk}')
          PY
      # نسخة تجريبية للتثبيت المباشر على هاتف أندرويد (موقّعة بمفتاح التطوير)
      # رقم البناء يظهر في حسابي، ويزيد مع كل بناء فيُثبَّت فوق النسخة السابقة
      - run: flutter build apk --release --build-number=${{ github.run_number }} --dart-define=BUILD_NUMBER=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: hajiz-android-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
